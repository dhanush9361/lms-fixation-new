<section class="flex h-[calc(100vh-4.5rem)] flex-col px-5 pb-5 pt-1">

  <!-- Heading on the left, tabs on the right (one row); the tabs sit right on top of the white card -->
  <div class="flex min-h-0 flex-1 flex-col animate-[settings-fade-up_600ms_cubic-bezier(0.2,0.75,0.25,1)_backwards]">

    <div class="flex flex-wrap items-end justify-between gap-x-6">

      <!-- Page heading (left) -->
      <div class="min-w-0 flex-1 basis-[260px] pb-3">
        <h1 class="text-xl font-semibold text-[#444]">Settings</h1>
        <p class="mt-1 text-xs text-[#555]">Manage all your settings in one place</p>
      </div>

      <!-- Folder-style tabs (right): the white tab has curved shoulders that flow into the white card -->
      <div
        role="tablist"
        aria-label="Settings sections"
        class="relative ml-auto grid w-[560px] max-w-full shrink-0"
        [style.grid-template-columns]="'repeat(' + tabs().length + ', minmax(0, 1fr))'"
      >
        <span
          class="settings-tab-shape"
          [class.no-right-curve]="activeIndex() === tabs().length - 1"
          [style.width]="'calc(100% / ' + tabs().length + ')'"
          [style.transform]="'translateX(' + activeIndex() * 100 + '%)'"
          aria-hidden="true"
        ></span>

        @for (tab of tabs(); track tab.id) {
          <button
            type="button"
            role="tab"
            [attr.aria-selected]="activeTab() === tab.id"
            [attr.aria-disabled]="!tab.enabled"
            [disabled]="!tab.enabled"
            (click)="selectTab(tab)"
            class="relative z-10 whitespace-nowrap rounded-t-2xl px-5 py-3 text-[13px] font-medium outline-none transition-colors duration-300 focus-visible:ring-2 focus-visible:ring-[#4694A4]/40 motion-reduce:transition-none"
            [class]="activeTab() === tab.id
              ? 'text-[#4eb3c4]'
              : tab.enabled
                ? 'cursor-pointer text-[#9aa7aa] hover:text-[#4694A4]'
                : 'cursor-default text-[#aaa]'"
          >
            {{ tab.label }}
          </button>
        }
      </div>
    </div>

    <!-- White card (top-right corner squares off under the last tab so they join) -->
    <div
      class="flex min-h-0 flex-1 flex-col bg-white px-[26px] pb-[26px] pt-[26px] shadow-[0_1px_2px_rgba(0,0,0,0.03)] transition-[border-radius] duration-300 motion-reduce:transition-none"
      [class]="activeIndex() === tabs().length - 1 ? 'rounded-[20px_0_20px_20px]' : 'rounded-[20px]'"
    >

    <!-- Content panel (re-created on tab change, so the entrance animation replays) -->
    <!-- Every tab sits straight on the white card (no grey panel) so grey / white layers don't alternate -->
    <div
      class="min-h-0 flex-1 overflow-y-auto rounded-[20px]"
      [class.settings-embed]="activeTab() === 'subscription'"
    >
      @switch (activeTab()) {

        @case ('general') {
          <div class="animate-[settings-fade-up_450ms_cubic-bezier(0.2,0.75,0.25,1)_backwards]" role="tabpanel">
            <app-two-fa-verification />
          </div>
        }

        @case ('subscription') {
          <div class="animate-[settings-fade-up_450ms_cubic-bezier(0.2,0.75,0.25,1)_backwards]" role="tabpanel">
            <app-subscription />
          </div>
        }

        @case ('invoice') {
          <div class="animate-[settings-fade-up_450ms_cubic-bezier(0.2,0.75,0.25,1)_backwards]" role="tabpanel">
            <app-invoice-setup />
          </div>
        }
      }
    </div>
    </div>
  </div>
</section>
